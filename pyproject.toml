[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tkg"
version = "0.1.0"
description = "A trusted knowledge layer over a legal-shaped estate: graph, index, policy and one resolver"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "rdflib>=7.1,<8",
    "pyshacl>=0.26,<1",
    "morph-kgc>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "PyYAML>=6,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "rich>=13,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
tkg = "tkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
