# The synthetic firm. Everything below is invented; no real firm, person, client
# or matter is described here. The generator is deterministic: same seed, same
# estate, same identifiers, every time.

seed: 20260924            # TKG_SEED overrides

offices: [Amsterdam, London, Frankfurt]

jurisdictions:
  - {id: NL, label: Netherlands}
  - {id: GB, label: United Kingdom}
  - {id: DE, label: Germany}
  - {id: EU, label: European Union}

practice_areas:
  - {id: asset-management-funds,    label: "Asset Management & Investment Funds"}
  - {id: financial-institutions,    label: "Financial Institutions"}
  - {id: tmt,                       label: "Technology, Media & Telecoms"}
  - {id: healthcare-life-sciences,  label: "Healthcare & Life Sciences"}
  - {id: energy-infrastructure,     label: "Energy & Infrastructure"}

matter_types:
  - {id: regulatory-investigation, label: "Regulatory investigation", practice_bias: [asset-management-funds, financial-institutions]}
  - {id: enforcement-action,       label: "Enforcement action",       practice_bias: [financial-institutions]}
  - {id: fund-formation,           label: "Fund formation",           practice_bias: [asset-management-funds]}
  - {id: corporate-transaction,    label: "Corporate transaction",    practice_bias: [tmt, energy-infrastructure]}
  - {id: commercial-litigation,    label: "Commercial litigation",    practice_bias: [financial-institutions, tmt]}
  - {id: regulatory-advisory,      label: "Regulatory advisory",      practice_bias: [healthcare-life-sciences, asset-management-funds]}

# Outcomes and areas of expertise are vocabularies, not free text: a fact points
# at a concept, so "settled" is one thing and not five spellings of it.
outcomes:
  - {id: no-action,      label: "Closed with no action"}
  - {id: settled-fine,   label: "Settled — administrative fine"}
  - {id: formal-warning, label: "Formal warning"}

expertise:
  - {id: afm-market-abuse, label: "AFM market-abuse investigations"}
  - {id: afm-settlement,   label: "Negotiating AFM settlements"}

client_types:
  - {id: fund-manager,       label: "Fund manager"}
  - {id: bank,               label: "Bank"}
  - {id: insurer,            label: "Insurer"}
  - {id: corporate,          label: "Corporate"}
  - {id: healthcare-provider,label: "Healthcare provider"}
  - {id: energy-company,     label: "Energy company"}

volumes:
  lawyers: 60
  clients: 150
  matters: 400
  first_year: 2018
  last_year: 2025
  team_size: [2, 6]
  open_matter_share: 0.18      # matters with no closed_on

# The mess is generated, not hand-written, because a firm's mess is systemic.
mess:
  crm_name_drift: 0.22         # share of CRM accounts spelled differently from PMS
  crm_missing_share: 0.10      # clients with no CRM account at all
  shared_surname_pairs: 4      # lawyers who share a family name with a colleague
  # Kinds for the generated restrictions, in order. One need-to-know matter, so
  # the lab covers both kinds of rule a firm runs. See docs/decisions/0007.
  restriction_kinds: [need-to-know, barrier, barrier, barrier]

name_pools:
  given: [Mara, Sanne, Kim, Joost, Pieter, Anouk, Willem, Fenna, Bram, Lotte, Daan, Sofie,
          Oliver, Charlotte, Harriet, Edward, Imogen, Rupert, Clara, Nadia, Yusuf, Aisha,
