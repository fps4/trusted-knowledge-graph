# The evaluation battery: thirty competency questions with known answers.
#
# Each question is asked two ways:
#   graph   through the resolver, as the persona, bound to a template — the design
#   vector  as plain words, answered by a model from the top-5 passages over the whole
#           index, with no access decision — the ordinary way
#
# `truth` says how the right answer is computed — from the estate itself, in Python,
# never from the graph being scored. The answer a *persona* should get removes what
# they are walled from; where nothing is left, the right answer is a refusal.
#
#   kind: ordinary · barrier (the persona is walled from what the question turns on)
#         · none (the truthful answer is that the firm has not done this)

questions:
