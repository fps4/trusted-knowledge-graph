# The capture step: facts told by a named person, with no document behind them —
# the outcome a partner knows and no system recorded. Each fact is loaded into
# its own graph, g:asserted/<by>/<told_on>, with its lineage in g:prov. (Not
# `on:` — YAML 1.1 reads that key as the boolean true.)
#
# Lineage is what makes these facts subject to barriers. A graph derived from a
# restricted matter is restricted; a graph derived from *that* graph is too.
# See docs/decisions/0008 and 0014.

facts:
  - id: F-0001
    by: P-0101
    told_on: 2022-03-04
    subject: matter/M-2021-0043
    predicate: hadOutcome
    object: outcome/no-action
    confidence: 1.0
    review: confirmed
    derived_from: [matter/M-2021-0043]

